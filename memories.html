<!DOCTYPE html>
<html lang="ja">

<head>

  <!-- =========================================================
       基本設定
       ========================================================= -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>思い出｜いつもね™</title>

  <meta
    name="description"
    content="いつもね™に登録した、うちの子との思い出や写真、記念日を振り返るアーカイブページです。"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >


  <!-- =========================================================
       共通CSS
       ========================================================= -->

  <link
    rel="stylesheet"
    href="style.css"
  >


  <!-- =========================================================
       アイコン
       ========================================================= -->

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="icons/icon-192.png"
  >

  <link

    href="icons/icon-192.png"

  <!-- =========================================================
       memories.html 専用CSS
       ========================================================= -->

  <style>

    /* ---------------------------------------------------------
       全体
       --------------------------------------------------------- */

    .memories-wrap {
      max-width: 760px;
      margin: 0 auto;
    }


    /* ---------------------------------------------------------
       現在のうちの子
       --------------------------------------------------------- */

    .current-pet {
      display: flex;
      align-items: center;
      gap: 16px;

      margin-bottom: 30px;

      padding: 18px 20px;

      background: white;

      border: 1px solid var(--line);
      border-radius: var(--radius);
    }


    .current-pet-photo {
      width: 72px;
      height: 72px;

      flex-shrink: 0;

      border-radius: 50%;

      object-fit: cover;

      background: #f2efeb;

      border: 1px solid var(--line);
    }


    .current-pet-info {
      flex: 1;
    }


    .current-pet-name {
      margin: 0;

      font-size: 22px;
      font-weight: 500;
    }


    .current-pet-sub {
      margin-top: 4px;

      color: var(--subtext);

      font-size: 13px;
    }


    /* ---------------------------------------------------------
       セクション
       --------------------------------------------------------- */

    .memory-section {
      margin-top: 38px;
    }


    .memory-section-title {
      margin: 0 0 16px;

      font-size: 21px;
      font-weight: 600;
    }


    /* ---------------------------------------------------------
       プロフィール写真
       --------------------------------------------------------- */

    .main-photo-card {
      overflow: hidden;

      background: white;

      border: 1px solid var(--line);
      border-radius: var(--radius);
    }


    .main-photo-image {
      width: 100%;

      aspect-ratio: 4 / 3;

      object-fit: cover;

      background: #f2efeb;
    }


    .main-photo-body {
      padding: 20px;
    }


    .main-photo-body h3 {
      margin: 0 0 6px;

      font-size: 18px;
    }


    .main-photo-body p {
      margin: 0;

      color: var(--subtext);
    }


    /* ---------------------------------------------------------
       タイムライン
       --------------------------------------------------------- */

    .timeline {
      position: relative;

      margin: 0;
      padding: 0;

      list-style: none;
    }


    .timeline::before {
      content: "";

      position: absolute;

      left: 13px;
      top: 8px;
      bottom: 8px;

      width: 2px;

      background: var(--line);
    }


    .timeline-item {
      position: relative;

      padding-left: 42px;

      margin-bottom: 22px;
    }


    .timeline-dot {
      position: absolute;

      left: 6px;
      top: 8px;

      width: 16px;
      height: 16px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--purple),
          var(--pink)
        );

      box-shadow:
        0 0 0 4px var(--bg);
    }


    .timeline-card {
      padding: 20px;

      background: white;

      border: 1px solid var(--line);
      border-radius: var(--radius-small);
    }


    .timeline-date {
      margin-bottom: 4px;

      color: var(--subtext);

      font-size: 13px;
    }


    .timeline-title {
      margin: 0 0 6px;

      font-size: 18px;
      font-weight: 600;
    }


    .timeline-text {
      margin: 0;

      color: var(--subtext);

      white-space: pre-wrap;
    }


    /* ---------------------------------------------------------
       その子らしさ
       --------------------------------------------------------- */

    .memory-grid {
      display: grid;
      gap: 18px;
    }


    .memory-card {
      padding: 24px;

      background: white;

      border: 1px solid var(--line);
      border-radius: var(--radius);
    }


    .memory-card-icon {
      margin-bottom: 8px;

      font-size: 28px;
    }


    .memory-card h3 {
      margin: 0 0 8px;

      font-size: 18px;
    }


    .memory-card p {
      margin: 0;

      color: var(--subtext);

      white-space: pre-wrap;
    }


    /* =========================================================
       追加された思い出
       ========================================================= */

    .added-memory-list {
      display: grid;
      gap: 20px;
    }


    .added-memory-card {
      overflow: hidden;

      background: white;

      border: 1px solid var(--line);
      border-radius: var(--radius);
    }


    .added-memory-photo {
      width: 100%;

      aspect-ratio: 4 / 3;

      object-fit: cover;

      background: #f2efeb;
    }


    .added-memory-body {
      padding: 22px;
    }


    .added-memory-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      margin-bottom: 10px;
    }


    .memory-date-badge,
    .memory-category-badge,
    .memory-place-badge {
      display: inline-block;

      padding: 4px 9px;

      border-radius: 999px;

      background: #f4f1ee;

      color: var(--subtext);

      font-size: 12px;
    }


    .added-memory-title {
      margin: 0 0 10px;

      font-size: 20px;
      font-weight: 600;
    }


    .added-memory-text {
      margin: 0;

      color: var(--subtext);

      line-height: 1.9;

      white-space: pre-wrap;
    }


    /* ---------------------------------------------------------
       編集・削除ボタン
       --------------------------------------------------------- */

    .memory-card-actions {
      display: flex;
      gap: 10px;

      margin-top: 18px;
    }


    .memory-action-btn {
      flex: 1;

      padding: 10px 14px;

      border-radius: 999px;

      text-align: center;

      font-size: 14px;

      cursor: pointer;
    }


    /* 編集 */
    .memory-edit-btn {
      background: white;

      border: 1px solid var(--line);
    }


    /* 削除 */
    .memory-delete-btn {
      background: white;

      color: #a94b4b;

      border: 1px solid #e8caca;
    }


    .memory-delete-btn:hover {
      background: #fff6f6;
    }


    /* ---------------------------------------------------------
       思い出なし
       --------------------------------------------------------- */

    .no-memories {
      padding: 34px 24px;

      text-align: center;

      background: white;

      border: 1px solid var(--line);
      border-radius: var(--radius);
    }


    .no-memories p {
      margin: 0 0 22px;

      color: var(--subtext);
    }


    /* ---------------------------------------------------------
       下部ボタン
       --------------------------------------------------------- */

    .memory-actions {
      display: grid;
      gap: 12px;

      margin-top: 36px;
    }


    /* ---------------------------------------------------------
       登録なし
       --------------------------------------------------------- */

    .empty-state {
      padding: 42px 24px;

      text-align: center;

      background: white;

      border: 1px solid var(--line);
      border-radius: var(--radius);
    }


    .empty-state img {
      width: 100px;

      margin: 0 auto 18px;
    }


    .empty-state h2 {
      margin: 0 0 10px;

      font-size: 23px;
      font-weight: 500;
    }


    .empty-state p {
      margin: 0 0 24px;

      color: var(--subtext);
    }


    /* ---------------------------------------------------------
       PC表示
       --------------------------------------------------------- */

    @media (min-width: 700px) {

      .memory-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }

  </style>

</head>


<body>


  <!-- =========================================================
       ヘッダー
       ========================================================= -->

  <header>

    <div class="container header-inner">

      <a
        href="index.html"
        class="brand"
      >

        <img
          src="icons/icon-192.png"
          alt="いつもね"
          class="brand-mark"
        >

        <div class="brand-name">
          いつもね<sup>™</sup>
        </div>

      </a>


      <button
        class="menu-button"
        aria-label="メニュー"

      >

      </button>

    </div>

  </header>



  <!-- =========================================================
       メイン
       ========================================================= -->

  <main>


    <!-- =======================================================
         ページタイトル
         ======================================================= -->

    <section class="page-hero">

      <div class="container">

        <img
          src="icons/icon-192.png"
          alt=""
          class="page-logo"
        >

        <h1 class="page-title">
          思い出
        </h1>

        <p class="page-subtitle">
          一緒に過ごした時間を、
          少しずつ残していきます。
        </p>

    <!-- =======================================================

    <section>

      <div class="container">

        <div
          id="memories-root"
          class="memories-wrap"
        >
        </div>

      </div>

    </section>


  </main>



  <!-- =========================================================
       フッター
       ========================================================= -->

  <footer>

    <div class="container">

      <img
        src="icons/icon-192.png"
        alt=""
        class="footer-logo"
      >

      <div>
        いつもね™ / Itsumone
      </div>

      <div>
        © 2026 03 LLC
      </div>

    </div>

  </footer>



  <!-- =========================================================
       JavaScript
       ========================================================= -->

  <script>

    /* =========================================================
       「うちの子」一覧を読む
       ========================================================= */

    const pets =
      JSON.parse(
        localStorage.getItem("itsumonePets") || "[]"
      );


    /* =========================================================
       現在選択中のうちの子ID
       ========================================================= */

    const currentPetId =
      localStorage.getItem("itsumoneCurrentPet");


    /* =========================================================
       表示先
       ========================================================= */

    const memoriesRoot =
      document.getElementById("memories-root");


    /* =========================================================
       HTMLエスケープ
       ========================================================= */

    function escapeHtml(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /* =========================================================
       日付表示
       ========================================================= */

    function formatDate(dateString) {

      if (!dateString) {
        return "";
      }


      const date =
        new Date(
          dateString + "T00:00:00"
        );


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return dateString;

      }


      return (
        date.getFullYear() +
        "年" +
        (date.getMonth() + 1) +
        "月" +
        date.getDate() +
        "日"
      );

    }


    /* =========================================================
       現在のうちの子を取得
       ========================================================= */

    function getCurrentPet() {

      if (pets.length === 0) {
        return null;
      }


      if (currentPetId) {

        const found =
          pets.find(
            pet =>
              String(pet.id) ===
              String(currentPetId)
          );


        if (found) {
          return found;
        }

      }


      return pets[pets.length - 1];

    }


    /* =========================================================
       基本プロフィールからタイムラインを作る
       ========================================================= */

    function buildTimeline(pet) {

      const items = [];


      if (pet.birthday) {

        items.push({

          date:
            pet.birthday,

          title:
            "生まれた日",

          text:
            `${escapeHtml(pet.name)}の誕生日`

        });

      }


      if (pet.welcomeDay) {

        items.push({

          date:
            pet.welcomeDay,

          title:
            "うちに来た日",

          text:
            "家族になった大切な日"

        });

      }


      if (pet.farewellDay) {

        items.push({

          date:
            pet.farewellDay,

          title:
            "お別れした日",

          text:
            "一緒に過ごした時間を、これからも。"

        });

      }


      items.sort(
        (a, b) =>
          new Date(a.date) -
          new Date(b.date)
      );


      return items;

    }


    /* =========================================================
       追加された思い出を取得
       
       ここでは毎回 localStorage から読み直します。
       削除後すぐに再描画できるようにするためです。
       ========================================================= */

    function getAllMemories() {

      return JSON.parse(
        localStorage.getItem("itsumoneMemories") || "[]"
      );

    }


    /* =========================================================
       現在の子の思い出だけ取り出す
       ========================================================= */

    function getPetMemories(pet) {

      const memories =
        getAllMemories();


      return memories.filter(
        memory =>
          String(memory.petId) ===
          String(pet.id)
      );

    }


    /* =========================================================
       思い出を並び替える
       ========================================================= */

    function sortMemories(memories) {

      return [...memories].sort(
        (a, b) => {

          /* 両方に日付あり */
          if (a.date && b.date) {

            return (
              new Date(b.date) -
              new Date(a.date)
            );

          }


          /* aだけ日付あり */
          if (a.date && !b.date) {
            return -1;
          }


          /* bだけ日付あり */
          if (!a.date && b.date) {
            return 1;
          }


          /* どちらも日付なし */
          return (
            new Date(b.createdAt || 0) -
            new Date(a.createdAt || 0)
          );

        }
      );

    }


    /* =========================================================
       思い出削除
       ========================================================= */

    function deleteMemory(memoryId) {

      /* ---------------------------------------------------------
         本当に削除するか確認
         --------------------------------------------------------- */

      const ok =
        confirm(
          "この思い出を削除しますか？\n\n" +
          "削除した内容は元に戻せません。"
        );


      /* キャンセル */
      if (!ok) {
        return;
      }


      /* ---------------------------------------------------------
         全思い出を読む
         --------------------------------------------------------- */

      const memories =
        getAllMemories();


      /* ---------------------------------------------------------
         対象ID以外を残す
         --------------------------------------------------------- */

      const updatedMemories =
        memories.filter(
          memory =>
            String(memory.id) !==
            String(memoryId)
        );


      /* ---------------------------------------------------------
         localStorageへ保存
         --------------------------------------------------------- */

      localStorage.setItem(
        "itsumoneMemories",
        JSON.stringify(updatedMemories)
      );


      /* ---------------------------------------------------------
         表示を更新
         --------------------------------------------------------- */

      renderMemories();

    }


    /* =========================================================
       追加思い出のHTMLを作る
       ========================================================= */

    function buildAddedMemoriesHtml(pet) {

      const petMemories =
        getPetMemories(pet);


      const sortedMemories =
        sortMemories(petMemories);


      /* ---------------------------------------------------------
         まだ思い出が無い場合
         --------------------------------------------------------- */

      if (sortedMemories.length === 0) {

        return `

          <div class="memory-section">

            <h2 class="memory-section-title">
              思い出の記録
            </h2>

            <div class="no-memories">

              <p>
                まだ追加された思い出はありません。
                <br>
                写真でも、出来事でも、
                何気ない一日でも残してみましょう。
              </p>

              <a
                href="memory-add.html"
                class="btn btn-primary"
              >
                最初の思い出を追加する
              </a>

            </div>

          </div>

        `;

      }


      /* ---------------------------------------------------------
         各思い出カード
         --------------------------------------------------------- */

      const cardsHtml =
        sortedMemories
          .map(
            memory => {

              /* 写真 */
              const photoHtml =
                memory.photo
                  ? `
                    <img
                      src="${memory.photo}"
                      alt="${escapeHtml(memory.title)}"
                      class="added-memory-photo"
                    >
                  `
                  : "";


              /* 日付 */
              const dateHtml =
                memory.date
                  ? `
                    <span class="memory-date-badge">
                      ${formatDate(memory.date)}
                    </span>
                  `
                  : `
                    <span class="memory-date-badge">
                      日付なし
                    </span>
                  `;


              /* カテゴリ */
              const categoryHtml =
                memory.category
                  ? `
                    <span class="memory-category-badge">
                      ${escapeHtml(memory.category)}
                    </span>
                  `
                  : "";


              /* 場所 */
              const placeHtml =
                memory.place
                  ? `
                    <span class="memory-place-badge">
                      📍 ${escapeHtml(memory.place)}
                    </span>
                  `
                  : "";


              /* 本文 */
              const textHtml =
                memory.text
                  ? `
                    <p class="added-memory-text">
                      ${escapeHtml(memory.text)}
                    </p>
                  `
                  : "";


              /* -------------------------------------------------
                 編集URL
                 
                 memory-edit.htmlへ思い出IDを渡します
                 ------------------------------------------------- */

              const editUrl =
                `memory-edit.html?id=${encodeURIComponent(memory.id)}`;


              /* -------------------------------------------------
                 カード本体
                 ------------------------------------------------- */

              return `

                <article class="added-memory-card">

                  ${photoHtml}

                  <div class="added-memory-body">

                    <div class="added-memory-meta">

                      ${dateHtml}

                      ${categoryHtml}

                      ${placeHtml}

                    </div>


                    <h3 class="added-memory-title">
                      ${escapeHtml(memory.title)}
                    </h3>


                    ${textHtml}


                    <!-- =======================================
                         編集・削除
                         ======================================= -->

                    <div class="memory-card-actions">

                      <!-- 編集 -->
                      <a
                        href="${editUrl}"
                        class="memory-action-btn memory-edit-btn"
                      >
                        編集
                      </a>


                      <!-- 削除 -->
                      <button
                        type="button"
                        class="memory-action-btn memory-delete-btn"
                        data-memory-id="${memory.id}"
                      >
                        削除
                      </button>

                    </div>

                  </div>

                </article>

              `;

            }
          )
          .join("");


      return `

        <div class="memory-section">

          <h2 class="memory-section-title">
            思い出の記録
          </h2>

          <div class="added-memory-list">

            ${cardsHtml}

          </div>

        </div>

      `;

    }


    /* =========================================================
       メイン表示
       ========================================================= */

    function renderMemories() {

      const pet =
        getCurrentPet();


      /* ---------------------------------------------------------
         うちの子未登録
         --------------------------------------------------------- */

      if (!pet) {

        memoriesRoot.innerHTML = `

          <div class="empty-state">

            <img
              src="icons/icon-192.png"
              alt=""
            >

            <h2>
              まだ、うちの子が登録されていません。
            </h2>

            <p>
              まずは名前と写真から、
              記録を始めてみましょう。
            </p>

            <a
              href="register.html"
              class="btn btn-primary"
            >
              うちの子を登録する
            </a>

          </div>

        `;

        return;

      }


      /* ---------------------------------------------------------
         プロフィール写真
         --------------------------------------------------------- */

      const photo =
        pet.photo
          ? pet.photo
          : "icons/icon-192.png";


      /* ---------------------------------------------------------
         サブ情報
         --------------------------------------------------------- */

      const subParts = [];


      if (pet.species) {

        subParts.push(
          escapeHtml(pet.species)
        );

      }


      if (pet.nickname) {

        subParts.push(
          `呼び名：${escapeHtml(pet.nickname)}`
        );

      }


      const subText =
        subParts.join("・");


      /* ---------------------------------------------------------
         大切な日
         --------------------------------------------------------- */

      const timeline =
        buildTimeline(pet);


      let timelineHtml = "";


      if (timeline.length > 0) {

        timelineHtml = `

          <div class="memory-section">

            <h2 class="memory-section-title">
              大切な日
            </h2>

            <ul class="timeline">

              ${timeline
                .map(
                  item => `

                    <li class="timeline-item">

                      <div class="timeline-dot"></div>

                      <div class="timeline-card">

                        <div class="timeline-date">
                          ${formatDate(item.date)}
                        </div>

                        <h3 class="timeline-title">
                          ${item.title}
                        </h3>

                        <p class="timeline-text">
                          ${item.text}
                        </p>

                      </div>

                    </li>

                  `
                )
                .join("")
              }

            </ul>

          </div>

        `;

      }


      /* ---------------------------------------------------------
         メイン写真
         --------------------------------------------------------- */

      const photoHtml = `

        <div class="memory-section">

          <h2 class="memory-section-title">
            写真
          </h2>

          <div class="main-photo-card">

            <img
              src="${photo}"
              alt="${escapeHtml(pet.name)}の写真"
              class="main-photo-image"
            >

            <div class="main-photo-body">

              <h3>
                ${escapeHtml(pet.name)}
              </h3>

              <p>
                いつもね、一緒に。
              </p>

            </div>

          </div>

        </div>

      `;


      /* ---------------------------------------------------------
         その子らしさ
         --------------------------------------------------------- */

      const cards = [];


      if (pet.favorites) {

        cards.push(`

          <div class="memory-card">

            <div class="memory-card-icon">
              ❤️
            </div>

            <h3>
              好きなもの
            </h3>

            <p>
              ${escapeHtml(pet.favorites)}
            </p>

          </div>

        `);

      }


      if (pet.personality) {

        cards.push(`

          <div class="memory-card">

            <div class="memory-card-icon">
              🐾
            </div>

            <h3>
              性格・しぐさ
            </h3>

            <p>
              ${escapeHtml(pet.personality)}
            </p>

          </div>

        `);

      }


      if (pet.firstMemory) {

        cards.push(`

          <div class="memory-card">

            <div class="memory-card-icon">
              📝
            </div>

            <h3>
              最初に残した思い出
            </h3>

            <p>
              ${escapeHtml(pet.firstMemory)}
            </p>

          </div>

        `);

      }


      let personalityHtml = "";


      if (cards.length > 0) {

        personalityHtml = `

          <div class="memory-section">

            <h2 class="memory-section-title">
              その子らしさ
            </h2>

            <div class="memory-grid">

              ${cards.join("")}

            </div>

          </div>

        `;

      }


      /* ---------------------------------------------------------
         追加思い出
         --------------------------------------------------------- */

      const addedMemoriesHtml =
        buildAddedMemoriesHtml(pet);


      /* ---------------------------------------------------------
         ページ本体
         --------------------------------------------------------- */

      memoriesRoot.innerHTML = `

        <!-- 現在のうちの子 -->
        <div class="current-pet">

          <img
            src="${photo}"
            alt="${escapeHtml(pet.name)}の写真"
            class="current-pet-photo"
          >

          <div class="current-pet-info">

            <h2 class="current-pet-name">
              ${escapeHtml(pet.name)}
            </h2>

            ${
              subText
                ? `
                  <div class="current-pet-sub">
                    ${subText}
                  </div>
                `
                : ""
            }

          </div>

        </div>


        <!-- メイン写真 -->
        ${photoHtml}


        <!-- 大切な日 -->
        ${timelineHtml}


        <!-- その子らしさ -->
        ${personalityHtml}


        <!-- 追加された思い出 -->
        ${addedMemoriesHtml}


        <!-- 下部操作 -->
        <div class="memory-actions">

          <a
            href="memory-add.html"
            class="btn btn-primary"
          >
            思い出を追加する
          </a>

          <a
            href="profile.html"
            class="btn btn-secondary"
          >

      `;


      /* ---------------------------------------------------------
         削除ボタンへイベントを付ける
         
         HTMLを書き換えたあとに行います
         --------------------------------------------------------- */

      const deleteButtons =
        document.querySelectorAll(
          ".memory-delete-btn"
        );


      deleteButtons.forEach(
        button => {

          button.addEventListener(
            "click",
            function () {

              const memoryId =
                this.dataset.memoryId;


              deleteMemory(memoryId);

            }
          );

        }
      );

    }


    /* =========================================================
       初回表示
       ========================================================= */

    renderMemories();

  </script>
